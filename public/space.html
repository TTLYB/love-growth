<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>宇宙房间</title>

<style>

body{
margin:0;
background:black;
overflow:hidden;
font-family:sans-serif;
color:white;
}

canvas{
position:fixed;
top:0;
left:0;
}

.center{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
z-index:10;
}

h1{
font-size:64px;
color:#ec4899;
}

button{
padding:16px 26px;
border:none;
border-radius:14px;
background:#ec4899;
color:white;
cursor:pointer;
font-size:18px;
}

</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="center">

<h1>✨ OUR UNIVERSE</h1>

<button onclick="location.href='index.html'">
进入宇宙
</button>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

const stars=[];

for(let i=0;i<200;i++){

stars.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*2
});

}

function draw(){

ctx.clearRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="white";

stars.forEach(s=>{

ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fill();

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
